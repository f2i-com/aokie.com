[package]
name = "aokie-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
chrono.workspace = true
ed25519-dalek = { version = "2", features = ["signature"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
uuid.workspace = true

# The steady clock protocol time is held against (src/clock.rs): the boot
# clock on Linux and Android, CLOCK_MONOTONIC on Apple's systems.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = "0.30"
