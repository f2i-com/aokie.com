[package]
name = "aokie-plugin"
description = "Aokie as a FormLogic Desktop plugin: JSON-RPC 2.0 NDJSON process over stdio (docs/FORMLOGIC_PLUGIN_CONTRACT.md). Binary entry per manifest.json; all native logic lives in aokie-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Call audio: the Desktop realtime lane that streams a call to OAIY's voice
# gateway (the OAIY route: OAIY Voice hears and speaks, OAIY's speak mode says
# Aokie's fixed lines) and the echo canceller (aec-rs) that takes OAIY's voice
# out of the caller's audio. Aokie has no speech of its own: no ONNX Runtime,
# no speech engines, no speech models. Without it the plugin texts, syncs
# contacts and lets calls ring through. `--features voice`.
voice = ["dep:reqwest", "dep:aec-rs"]
# Controlled WinUSB self-signing path for administrator-managed beta installs.
# The runtime still requires the operator's opt-in: acceptance of the install on
# the dongle setup screen, or AOKIE_ALLOW_SELF_SIGNED_DRIVER=1.
managed-beta-driver = ["aokie-dongle/managed-beta-driver"]

[dependencies]
aokie-core = { path = "../aokie-core" }
aokie-media = { path = "../aokie-media" }
aokie-protocol = { path = "../aokie-protocol" }
# The Companion relay carrier and the older in-plugin LLM client (voice
# feature). Blocking API read line-by-line = SSE streaming without a tokio
# runtime. rustls to avoid a native-TLS build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"], optional = true }
# Acoustic echo cancellation (voice feature): on the OAIY route OAIY's voice,
# played into the call, is cancelled out of the caller's audio before that is
# streamed back to OAIY. Bundles the speexdsp C echo canceller via aec-rs-sys,
# so no system libspeexdsp needed.
aec-rs = { version = "1.0", optional = true }
# The radio bridge (every system the radio stack has a USB transport for), dongle enumeration, and on Windows the
# WinUSB driver install (dongle.installDriver), which the other systems do not have: they install no driver.
aokie-dongle = { path = "../aokie-dongle" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# CONSENT-001: verify the Desktop-issued signature on consent grants (the
# verify key arrives via the parent process env; grants that don't verify
# never satisfy the consent gate).
ed25519-dalek = { version = "2", features = ["signature"] }
base64 = "0.22"
regex = "1"
# Same major as the legacy app (aokie-desktop pins 0.31) so the two
# don't fight over bundled-SQLite versions when built side by side.
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"

# Windows multimedia-timer API (winmm) — raise this process's timer resolution
# to 1 ms while the radio runs. The isochronous SCO audio path services a USB
# frame every 1 ms; since Win10 2004 / Win11 the timer resolution is PER-PROCESS,
# so a bare stdio plugin sits at the ~15.6 ms default, which is far too coarse —
# read_sco's waits + TX pacing miss the iso cadence and every transfer fails
# (empty descriptors + Win32 87). The original Tauri app gets 1 ms for free via
# WebView2/Chromium; a headless plugin must ask for it explicitly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
# Native Windows-stack radio backend (transportMode=native) — the
# no-driver-install transport sitting beside the WinUSB dongle backend.
aokie-winbt = { path = "../aokie-winbt" }

[dev-dependencies]
# Contract tests: manifest.json against plugin-manifest.schema.json,
# mock lifecycle events against desktop-event.schema.json (local
# copies under docs/contracts/).
aokie-realtime = { path = "../aokie-realtime" }
axum = "0.7"
jsonschema = "0.30"
tempfile = "3"

[[example]]
name = "capture_turn_check"
required-features = ["voice"]
