[package]
name = "aokie-plugin"
description = "Aokie as a FormLogic Desktop plugin: JSON-RPC 2.0 NDJSON process over stdio (docs/FORMLOGIC_PLUGIN_CONTRACT.md). Binary entry per manifest.json; all native logic lives in aokie-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aokie-core = { path = "../aokie-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# Same major as the legacy app (aokie-desktop pins 0.31) so the two
# don't fight over bundled-SQLite versions when built side by side.
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
# Contract tests: manifest.json against plugin-manifest.schema.json,
# mock lifecycle events against desktop-event.schema.json (local
# copies under docs/contracts/).
jsonschema = "0.30"
tempfile = "3"
