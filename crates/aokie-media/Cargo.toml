[package]
name = "aokie-media"
description = "Native WebRTC media bridge shared by the Aokie Desktop endpoint and Companion."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3"
libwebrtc = "=0.3.43"
serde = { workspace = true }
thiserror = "2"
tokio = { version = "1.40", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
