[package]
name = "aokie-ai"
description = "Aokie's swappable AI provider stack: LlmProvider/TtsProvider/SttProvider traits + registry + config, the OpenAI-compatible HTTP LLM adapter and llama-server sidecar (light, always compiled), and the in-process ONNX/Candle/sherpa engines behind opt-in features. Tauri-free; depends on aokie-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# secrets (keyring-backed provider API keys) + paths (atomic_write) +
# redact (audit log) all live in aokie-core.
aokie-core = { path = "../aokie-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# Async provider-trait shape (LlmProvider / TtsProvider / SttProvider)
# and every adapter impl.
async-trait = "0.1"
# HTTP LLM adapter (streaming SSE) + the llama-server readiness probe.
# rustls-tls keeps it off system OpenSSL; `stream` powers the SSE body.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# `futures::StreamExt` over the reqwest byte stream in the HTTP adapter.
futures = "0.3"
# `tokio::time` for the sidecar readiness poll; `sync::Mutex` for the
# runtime-handle registry entry points (feature-gated).
tokio = { version = "1.0", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# llama-server per-session bearer token (CSPRNG) — also used by the
# onnx-tts sampler under the `onnx` feature.
rand = "0.8"

# ============== onnx feature: ONNX-Runtime engines ==============
# Gemma-4 GenAI LLM, Pocket-TTS ONNX voice, Parakeet, and (via the
# vendored transcribe-rs) Moonshine + Qwen3-ASR. `load-dynamic` pulls
# the ORT DLL at runtime — no CMake in the build. Off by default.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "half"], optional = true }
ndarray = { version = "0.17", optional = true }
half = { version = "2", features = ["num-traits"], optional = true }
safetensors = { version = "0.4", optional = true }
rubato = { version = "0.14", optional = true }
hound = { version = "3.5", optional = true }
rand_distr = { version = "0.4", optional = true }
# Vendored fork of transcribe-rs at ../transcribe-rs — the Moonshine /
# Qwen3-ASR ONNX engines. Only pulled by the `onnx` feature.
transcribe-rs = { path = "../transcribe-rs", default-features = false, features = ["onnx", "qwen3-asr"], optional = true }

# ============== candle feature: Candle Whisper STT ==============
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
# candle_whisper holds the model behind a parking_lot::Mutex.
parking_lot = { version = "0.12", optional = true }

# Shared by both `onnx` (Gemma tokenizer) and `candle` (Whisper
# tokenizer); the Gemma-4 mel front-end and the Whisper mel helper both
# use rustfft.
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
rustfft = { version = "6", optional = true }

# ============== sherpa feature: sherpa-onnx STT/TTS ==============
# Silero VAD + sherpa-onnx TTS/STT. Heavy `sherpa-rs-sys` CMake build,
# so strictly opt-in.
sherpa-rs = { version = "0.6", default-features = false, features = ["tts"], optional = true }

[dev-dependencies]
# config.rs tests mint a temp path with a random suffix.
uuid = { version = "1.0", features = ["v4"] }

[features]
# Light by default: traits + registry + config + the HTTP LLM adapter +
# the llama-server sidecar. No ort/candle/sherpa → no CMake, no ORT DLL
# fetch. `cargo build -p aokie-ai` must stay green with this set.
default = []

# ONNX-Runtime engines (Gemma-4 LLM, Pocket-TTS, Parakeet, and the
# transcribe-rs Moonshine/Qwen3-ASR engines).
onnx = [
    "dep:ort",
    "dep:ndarray",
    "dep:half",
    "dep:safetensors",
    "dep:rubato",
    "dep:hound",
    "dep:rand_distr",
    "dep:tokenizers",
    "dep:rustfft",
    "dep:transcribe-rs",
]

# Candle-based Whisper STT.
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:parking_lot",
    "dep:tokenizers",
    "dep:rustfft",
]

# sherpa-onnx STT/TTS via sherpa-rs (needs CMake).
sherpa = ["dep:sherpa-rs"]

# ⚠️ STATIC sherpa is a DEAD END in binaries that also link aec-rs: both
# speexdsp (the echo canceller) and sherpa-onnx vendor KISS FFT with the
# same un-namespaced symbols (kiss_fftr_alloc/kiss_fftr/kiss_fftri), so a
# static sherpa multiply-defines against speexdsp.lib at link time — and
# /FORCE:MULTIPLE would silently mix potentially ABI-incompatible FFTs into
# the AEC. The `sherpa` feature therefore builds sherpa-rs-sys DYNAMIC
# (CMake source build; DLLs land in target/<profile> and must ship next to
# the exe): sherpa-onnx-c-api.dll + its own onnxruntime.dll (1.17.1).
# Consumers that ALSO use the ort-based engines must resolve their ORT DLL
# by explicit versioned name (see ensure_ort_dylib in aokie-plugin/
# aokie-voice-server) so sherpa's onnxruntime.dll never shadows it.
# Builds need libclang for bindgen (LIBCLANG_PATH in .cargo/config.toml).

# CUDA execution provider for the ort-based engines ONLY. With ort in
# load-dynamic mode this is build-time free (no CUDA toolkit needed to
# compile) — it just compiles in the CUDA EP registration API. The GPU
# onnxruntime dylib + cuDNN are resolved at RUNTIME (ORT_DYLIB_PATH);
# missing pieces degrade to the CPU EP with a logged warning.
onnx-cuda = ["onnx", "ort/cuda"]

# Full GPU stack: the ort CUDA EP above PLUS candle's CUDA kernels.
# Candle CUDA needs the CUDA toolkit + matching VS integration at build
# time; opt-in only.
cuda = [
    "onnx-cuda",
    "candle",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
