[package]
name = "aokie-core"
description = "Tauri-free native foundation shared by the Aokie crates (bluetooth/dongle/audio/db) and the FormLogic Desktop plugin. NO tauri dependency is allowed here — enforced by the no_tauri unit test."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Cross-platform data/config dir resolution (paths.rs, crashlog.rs).
dirs = "5.0"
# consent.rs adds a small random jitter to grace-window timestamps.
rand = "0.8"
url = "2"
# OS-native secret store for provider API keys (secrets.rs). Windows
# path stays on Win32 APIs (Credential Manager / DPAPI) only.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    # Linux: the Secret Service (GNOME Keyring, KWallet), which keeps a secret across log-ins and restarts, through
    # libdbus (libdbus-1-dev to build; every desktop has libdbus-1-3). The kernel's keyring ("linux-native") lost it
    # at every restart: a provider's API key, and the key values sealed at rest are sealed under, with it.
    "sync-secret-service",
    # (the Secret Service's session encrypted in Rust, not with OpenSSL)
    "crypto-rust",
] }

# keychain_seal.rs: the cipher for values sealed at rest on macOS and Linux, where the key lives in the login
# Keychain or the Secret Service. Windows seals with DPAPI and does not link it; the cipher's own tests run on every
# system (dev-dependencies).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
ring = "0.17"

# crashlog.rs redirects native stderr/stdout to a forensic log file via
# SetStdHandle; all of it is `#[cfg(windows)]`-gated internally.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # CreateFileW's signature references SECURITY_ATTRIBUTES, so the
    # Storage_FileSystem binding needs Win32_Security enabled too.
    "Win32_Security",
    # dpapi.rs (PAIR-001): CryptProtectData / CryptUnprotectData for
    # sealing small credentials (Bluetooth link keys) at rest.
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[dev-dependencies]
ring = "0.17"
