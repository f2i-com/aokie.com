[package]
name = "aokie-voice-server"
description = "Loopback-only OpenAI-compatible STT/TTS HTTP service for Aokie's local ONNX voice runtimes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `sherpa` adds the dynamic sherpa-onnx TTS engine (VOX-401) — its DLLs ship
# next to the exe; ensure_ort_dylib pins the VERSIONED ORT name so sherpa's
# bundled onnxruntime.dll (1.17.1) never shadows the ort engines' 1.25.0.
aokie-ai = { path = "../aokie-ai", features = ["onnx", "sherpa", "onnx-cuda"] }
aokie-core = { path = "../aokie-core" }
serde = { workspace = true }
serde_json = { workspace = true }
hound = "3.5"
# Variant/quantization types the Moonshine + Qwen3-ASR constructors take —
# the same vendored fork aokie-ai's `onnx` feature builds against.
transcribe-rs = { path = "../transcribe-rs", default-features = false, features = ["onnx", "qwen3-asr"] }
