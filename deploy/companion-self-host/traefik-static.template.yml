global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop

ping:
  entryPoint: health

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # Bounds how long a client may take to send its request (the
        # WebSocket upgrade has no body), so a slow or stalled client cannot
        # hold a connection open forever. It does not cut a live WebSocket:
        # Go's HTTP server clears the connection's deadlines when the proxy
        # takes over an upgraded connection, which is how Traefik's own 60 s
        # default coexists with long-lived WebSockets.
        readTimeout: 30s
        writeTimeout: 0s
        idleTimeout: 180s
  turns:
    address: ":5349"
  health:
    address: "127.0.0.1:8082"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "__ACME_EMAIL__"
      storage: /var/lib/traefik/acme.json
      httpChallenge:
        entryPoint: web
