# Runtime values (realm, REST secret, relay range and public/private address
# mappings) are appended in /tmp by coturn-entrypoint.sh. Never put a secret in
# this checked-in file.
listening-port=3478
tcp-proxy-port=3479
fingerprint
use-auth-secret
stale-nonce=600
max-allocate-lifetime=3600

# TLS is terminated by the maintained edge proxy on TCP/5349. The private
# PROXY-v2 listener above preserves the real client address. DTLS/5349 is not
# exposed; WebRTC has UDP/TCP TURN on 3478 and TURN/TLS on 5349.
no-tls
no-dtls

# Do not accidentally become an anonymous/open relay. Coturn 4.14 keeps its
# CLI/admin plane off by default; no web-admin or CLI option is enabled here.
no-multicast-peers
unauthorized-ratelimit
unauthorized-ratelimit-rps=10
no-software-attribute
pidfile=/tmp/turnserver.pid

log-file=stdout
simple-log
new-log-timestamp
