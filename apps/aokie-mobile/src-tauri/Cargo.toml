[package]
name = "aokie-mobile"
version = "0.1.0"
description = "Aokie Companion mobile receptionist"
authors = ["Aokie"]
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = []
# Tauri's production asset protocol is opt-in. Release packaging must enable
# this feature so the compiled app embeds `frontendDist` instead of attempting
# to load the development server from localhost.
custom-protocol = ["tauri/custom-protocol"]
# Deliberate local managed-pilot build. This permits only the exact WAMP
# `api.formlogic.local` API host over HTTP and a numeric loopback gateway WS;
# normal release builds remain HTTPS/WSS-only.
managed-beta-local = []
# Test hook, never for a shipped build: at start-up the app makes real HTTPS requests
# (a public site and negative controls) and writes each result to logcat under the tag
# `AokieProbe`. It exists to show on a device or emulator whether the TLS stack works.
https-probe = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aokie_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
aokie-protocol = { path = "../../../crates/aokie-protocol" }
aokie-media = { path = "../../../crates/aokie-media" }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libwebrtc = "=0.3.52"
# The certificate verifier behind reqwest's `rustls` feature. It needs the Android Context before
# its first handshake (see `native_init.rs`) and is built on jni 0.22, while Tauri, wry and
# libwebrtc use 0.21: the two coexist under different crate names.
rustls-platform-verifier = "0.7"
jni22 = { package = "jni", version = "0.22" }
# The Companion's WebSockets verify with the same platform verifier and the same aws-lc-rs provider
# as reqwest (see `ws_tls.rs`); both are already in the graph through reqwest.
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

# Host tests build `ws_tls.rs`'s Android configuration too, so its API use is checked off a device.
[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-platform-verifier = "0.7"
