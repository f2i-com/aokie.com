[workspace]
resolver = "2"
members = [
    "apps/aokie-mobile/src-tauri",
    "crates/aokie-media",
    "crates/aokie-protocol",
    "crates/aokie-realtime",
    "crates/aokie-core",
    "crates/aokie-bluetooth",
    "crates/aokie-dongle",
    # Native Windows-stack radio backend (WinRT Calls + WASAPI HF + RFCOMM
    # MAP/PBAP) — the no-driver-install transport. Kept out of
    # default-members (like aokie-plugin): built explicitly.
    "crates/aokie-winbt",
    "crates/aokie-audio",
    "crates/aokie-db",
    "crates/aokie-ai",
    "crates/aokie-voice-server",
    "crates/aokie-receptionist",
    "crates/aokie-plugin",
    # First-party Ed25519 bundle signing (TRUST-001): writes package-manifest.json
    # pinning every release-bundle file's digest; FormLogic Desktop pins the public
    # key and refuses to launch tampered plugin directories.
    "crates/package-signer",
    # Vendored fork of andrewleech/transcribe-rs — the ONNX ASR engines
    # (Moonshine, Qwen3-ASR, …). A member so the workspace shares one
    # lock + bundled-SQLite/ort version; kept out of default-members
    # because it only builds under aokie-ai's opt-in `onnx` feature.
    "crates/transcribe-rs",
]

# `aokie-plugin` (the FormLogic Desktop JSON-RPC process) is a member
# but is intentionally kept out of `default-members`: a later task
# wires its runtime up against these crates. `default-members` keeps a
# bare `cargo build` scoped to the five native library crates that are
# known-green so the not-yet-wired plugin can't break the default build.
default-members = [
    "crates/aokie-core",
    "crates/aokie-bluetooth",
    "crates/aokie-dongle",
    "crates/aokie-audio",
    "crates/aokie-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV (audit AK-19) — verified with cargo +1.88.0 check on the shipping crates;
# the -Msrv gate in scripts/check-release.ps1 re-verifies.
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

# GTK 3 compatibility backport of RUSTSEC-2024-0429 (see vendor/README.md).
[patch.crates-io]
glib = { path = "vendor/glib" }
