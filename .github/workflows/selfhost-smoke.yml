name: Self-host smoke

# Audit AK-14: nothing previously built the self-host Dockerfile, validated
# the Compose files, or booted the local profile — the exact container
# artifact (with its own --locked dependency graph) was never exercised.
# Automatic CI is temporarily paused while checks are run manually.
# Manual dispatch remains available from the Actions tab.
#
# Scope: the container lock fitting its crates (scripts/check-container-lock.sh),
# template rendering acceptance, compose config validation (both
# profiles), coturn started with the public profile's deny list,
# image build with --pull, local-profile boot to HEALTHY (the
# coturn healthcheck performs a real STUN transaction), gateway /version,
# container-lock cargo audit, teardown. The full WebSocket handshake +
# forced-relay TURN allocation remains the labelled manual step
# (deploy/companion-self-host/test-forced-relay.ps1).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhost:
    name: self-host container smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/companion-self-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As every other checkout here (ci.yml): the token is not left in .git, where a build step could read it.
          persist-credentials: false

      - name: Container lockfile fits its crates (cargo metadata --locked)
        # The image builds the two-member container workspace with --locked: a lock that no longer fits its
        # crates fails here in seconds, with the image's own Rust, before the image build (review 3 #3).
        run: docker run --rm -v "$PWD/../..:/repo:ro" -w /repo rust:1.92.0-slim sh scripts/check-container-lock.sh

      - name: Render acceptance (AK-14 email escaping)
        run: sh render-test.sh

      - name: Temporary secrets
        # As the README's setup: Docker mounts a file secret with its host owner and mode, and each container reads
        # its own as an unprivileged user (gateway 65532, coturn's nobody 65534). Left as the runner's 0600 files,
        # both entrypoints stop with "secret is not readable" and the boot below never turns healthy.
        run: |
          umask 077
          openssl rand -hex 32 > secrets/admission-hmac.txt
          openssl rand -hex 32 > secrets/lease-hmac.txt
          openssl rand -hex 32 > secrets/turn-rest.txt
          sudo chown 65532:65532 secrets/admission-hmac.txt secrets/lease-hmac.txt
          sudo chown 65534:65534 secrets/turn-rest.txt
          sudo chmod 0400 secrets/admission-hmac.txt secrets/lease-hmac.txt secrets/turn-rest.txt

      - name: coturn starts with the public profile's deny list
        # The local profile below allows private peers, so it never renders the public deny list; coturn aborts at
        # start on an entry it cannot parse (an invalid IPv6 bound kept the public profile down from July to November
        # 2026). Start the pinned image with the public branch and ask it for a STUN answer.
        run: |
          image="$(sed -n 's/^ *image: \(coturn\/coturn:.*\)$/\1/p' compose.yaml | head -n 1)"
          [ -n "$image" ] || { echo "no coturn image in compose.yaml"; exit 1; }
          docker run -d --name coturn-public-check --read-only \
            --tmpfs /tmp:size=16m,mode=1777 --tmpfs /var/lib/coturn:size=16m,mode=0700 --tmpfs /var/run:size=4m,mode=0755 \
            -e TURN_SECRET_FILE=/run/secrets/turn_rest -e TURN_REALM=turn.example.com \
            -e TURN_EXTERNAL_IPV4=203.0.113.10 -e TURN_ALLOW_PRIVATE_PEERS=0 \
            -v "$PWD/coturn-entrypoint.sh:/opt/aokie/coturn-entrypoint.sh:ro" \
            -v "$PWD/coturn.base.conf:/etc/coturn/turnserver.base.conf:ro" \
            -v "$PWD/secrets/turn-rest.txt:/run/secrets/turn_rest:ro" \
            --entrypoint /bin/sh "$image" /opt/aokie/coturn-entrypoint.sh
          ok=0
          for attempt in $(seq 1 20); do
            if docker exec coturn-public-check turnutils_stunclient -p 3478 -t 1000 127.0.0.1 > /dev/null 2>&1; then ok=1; break; fi
            [ "$(docker inspect -f '{{.State.Running}}' coturn-public-check)" = true ] || break
            sleep 1
          done
          docker logs coturn-public-check 2>&1 | grep -E 'ERROR|Abort' || true
          docker rm -f coturn-public-check > /dev/null
          [ "$ok" = 1 ] || { echo "coturn did not start with the public deny list"; exit 1; }

      - name: Compose config — public profile
        run: |
          SIGNAL_HOST=signal.example.com TURN_HOST=turn.example.com \
          ACME_EMAIL=ops/turn@example.com TURN_REALM=turn.example.com \
          TURN_EXTERNAL_IPV4=203.0.113.10 \
          docker compose -f compose.yaml config --quiet

      - name: Compose config — local profile
        run: docker compose -f compose.local.yaml config --quiet

      - name: Build gateway image (--pull, container-locked graph)
        # The compose file owns the build context (repo root) and RUST_VERSION
        # build arg — building through it is what production does.
        run: AOKIE_IMAGE_TAG=smoke docker compose -f compose.local.yaml build --pull

      - name: Boot local profile to healthy
        run: |
          AOKIE_IMAGE_TAG=smoke docker compose -f compose.local.yaml up -d --no-build --wait --wait-timeout 120

      - name: Gateway /version
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18788/version
          echo

      - name: Teardown
        if: always()
        run: docker compose -f compose.local.yaml down -v --remove-orphans

      - name: Audit the container lockfile (RustSec)
        run: |
          docker run --rm -v "$PWD/container-workspace:/w" -w /w rust:1.92.0-slim sh -c \
            'cargo install cargo-audit --locked >/dev/null 2>&1 && cargo audit'
