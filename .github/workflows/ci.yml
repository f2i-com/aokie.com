name: CI

# Audit REL-001/C-09: this repo previously had NO CI — the plugin's contract,
# lifecycle, isolation and delivery guarantees were only tested on the dev
# machine. Runs on Windows, where the plugin's WinUSB radio and its driver
# are; a release's Mac bundle is built on a Mac (plugin-release-macos), and its
# Linux bundle on Ubuntu 22.04 (plugin-release-linux).
# Automatic CI is temporarily paused while checks are run manually.
# Keep the workflow available through the Actions tab; restore automatic
# triggers only when the project is ready to re-enable CI.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'The release bundle to build: production (needs the Microsoft-signed driver catalog and the Authenticode certificate) or managed-beta (a pre-release without either). A tag whose name contains managed-beta always builds managed-beta.'
        type: choice
        options: [production, managed-beta]
        default: production
      attach_macos_to:
        description: "A release's tag (v0.0.2-managed-beta, say) to attach this run's Mac bundle to, for a release made before Aokie had one. Empty: the Mac bundle stays the run's artifact."
        type: string
        default: ''
      attach_linux_to:
        description: "A release's tag to attach this run's Linux bundle to, for a release made before Aokie had one. Empty: the Linux bundle stays the run's artifact."
        type: string
        default: ''
  # push:
  #   branches: [main]
  #   tags: ['v*']
  # pull_request:
  #   branches: [main]

# TRUST-001: least privilege by default — read-only token everywhere; the four
# jobs that publish release assets (production, managed-beta, and the Mac and
# Linux bundles' publish-macos and publish-linux) ask for contents:write themselves.
permissions:
  contents: read

jobs:
  plugin:
    name: aokie-plugin (tests, default features)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      - name: Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # The WHOLE shipping workspace (audit AOK-CI-001): core, bluetooth, db,
      # audio, dongle, receptionist AND the plugin — the
      # radio/recovery logic lives in crates the old plugin-only run never
      # touched. Contract drift gates, call lifecycle, outbox, endpoint
      # classification and truthful health all ride along.
      - name: Tests (workspace)
        run: cargo test --workspace

  plugin-voice:
    name: aokie-plugin (test + clippy, voice feature)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # The voice build compiles a distinct cfg surface (the realtime lane to
      # OAIY, AEC, the call loop) that the default build never touches. Audit
      # AK-15: the SHIPPING feature set is TESTED and clippy-linted here, not
      # merely cargo-checked — a failing #[cfg(feature = "voice")] test or
      # deny-level lint blocks the release chain (plugin-release depends on
      # this job). --test-threads=2: the synthetic-audio/QuickJS timing tests
      # are a documented flake class under full parallel load.
      - name: Tests (voice)
        run: cargo test -p aokie-plugin --features voice -- --test-threads=2

      - name: Clippy (voice, deny-level lints)
        run: cargo clippy -p aokie-plugin --all-targets --features voice

  # Audit AK-18: the documented SHIPPING combination (voice,managed-beta-driver)
  # compiles as its own gate — a managed-beta-only cfg break used to reach the
  # release job before anything noticed. Compile-only (the mbd self-sign paths
  # are runtime-gated and covered by the plugin's own tests).
  managed-beta:
    name: managed-beta shipping combination (compile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Check plugin (voice,managed-beta-driver)
        run: cargo check -p aokie-plugin --features voice,managed-beta-driver
      - name: Check driver helper (managed-beta-driver)
        run: cargo check -p aokie-dongle --features managed-beta-driver --bins

  # Audit AK-16: the Companion React/TypeScript app ships from this repo but
  # had no CI coverage at all — a TypeScript error or failing Vitest now
  # blocks the release chain.
  companion:
    name: Companion app (TypeScript + Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/aokie-mobile/package-lock.json
      - name: Install
        working-directory: apps/aokie-mobile
        run: npm ci
      - name: Tests
        working-directory: apps/aokie-mobile
        run: npm test
      - name: Build (tsc --noEmit + vite build)
        working-directory: apps/aokie-mobile
        run: npm run build

  # Lint gate (audit FL-CI-001): clippy's deny-level lints (correctness class)
  # block merge across the whole workspace and all targets. Style warnings
  # remain visible but non-blocking (~178 pre-existing; burn-down tracked) —
  # gating them today would force a blind churn through the radio crate.
  clippy:
    name: cargo clippy (deny-level lints)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # Supply-chain gate (audit AOK-CI-001): RustSec advisories fail CI — accept
  # an unavoidable one explicitly via audit.toml with a documented reason.
  supply-chain:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    # Run cargo-audit directly rather than rustsec/audit-check: the action posts
    # a check-run and needs write scope (the default read-only GITHUB_TOKEN gave
    # "Resource not accessible by integration"). Plain cargo audit needs no token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit
      # Accepted transitive advisories are listed with rationale in
      # .cargo/audit.toml; every NEW advisory still fails the job.
      - run: cargo audit

  # Audit PKG-001 + TRUST-001 + DIST-001: the RELEASE bundle — helper built
  # first so its post-build SHA-256 can be pinned into the plugin (the
  # aokie-dongle release gate), then plugin (voice) + helper + manifests +
  # checksums, first-party-signed (package-manifest.json) and, on
  # tags, published as a DURABLE release asset. Tag builds FAIL without the
  # required signing credentials (Authenticode cert + package signing key);
  # workflow_dispatch smoke builds may proceed unsigned with loud warnings.
  plugin-release:
    name: aokie-plugin release bundle
    runs-on: windows-latest
    # Audit AK-17: publication depends on EVERY release prerequisite — a manual
    # dispatch on a tag can no longer upload while clippy, the supply-chain
    # audit, the Companion frontend, or the shipping-feature gates fail or are
    # still running.
    needs: [plugin, plugin-voice, clippy, supply-chain, managed-beta, companion]
    # A managed-beta tag or dispatch builds the managed-beta bundle below instead, never this one.
    if: (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && !contains(github.ref_name, 'managed-beta') && inputs.bundle != 'managed-beta'
    permissions:
      # gh release create/upload on tag builds — one of the two write surfaces in
      # this workflow (with the managed-beta job), each isolated to its job (TRUST-001 item 5).
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      - name: Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Audit AOK-REL-001: the ONLY correct order is
      #   build helper → SIGN helper → VERIFY signature → hash the SIGNED
      #   bytes → build plugin with that hash pinned → sign plugin → verify →
      #   self-test → package.
      # The old job hashed the helper BEFORE signing, so a signed release
      # shipped a plugin whose embedded pin could never match the signed
      # helper — acknowledged only as a warning. Every verification below is
      # a hard failure; nothing about integrity is warning-only anymore.
      - name: Build + sign helper, pin SIGNED hash, build + sign plugin
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # TRUST-001: a PUBLIC TAG RELEASE without the Authenticode cert is a
          # hard failure — never an "unsigned flavour". Manual dispatch smoke
          # builds may proceed unsigned (loudly) for pipeline testing.
          if (-not $env:CERT_B64 -and '${{ github.ref_type }}' -eq 'tag') {
            throw "TRUST-001: tag releases require WINDOWS_CERT_PFX_B64/WINDOWS_CERT_PASSWORD — refusing to produce an unsigned public release"
          }

          # DIST-01 / DRV-02: compile the exact Microsoft-signed driver pair
          # into the helper's trust decision. This applies to smoke bundles as
          # well as tags: no assembled release is allowed to omit the driver.
          $driverInf = 'drivers/winusb/aokie_winusb_bluetooth.inf'
          $driverCat = 'drivers/winusb/aokie_winusb_bluetooth.cat'
          if (-not (Test-Path -LiteralPath $driverInf -PathType Leaf) -or -not (Test-Path -LiteralPath $driverCat -PathType Leaf)) {
            throw "AK-DIST-01: release requires the static INF and Microsoft attestation/WHQL-signed CAT under drivers/winusb"
          }
          # The Windows Kits signtool is needed for DRIVER verification on every
          # build (signed or not). Its presence is NOT the signal that this
          # build signs executables — that is $signingEnabled below (audit AK-01:
          # the unsigned smoke path used to test the tool variable and then
          # invoke `signtool sign /f $null`).
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "AK-DIST-01: signtool.exe (Windows Kits) is required to verify the driver catalog" }
          & $signtool verify /kp /c $driverCat $driverInf
          if ($LASTEXITCODE -ne 0) { throw "AK-DIST-01: catalog is not kernel-policy trusted or does not bind the exact INF" }
          $env:AOKIE_EXPECTED_DRIVER_INF_SHA256 = (Get-FileHash $driverInf -Algorithm SHA256).Hash.ToLower()
          $env:AOKIE_EXPECTED_DRIVER_CAT_SHA256 = (Get-FileHash $driverCat -Algorithm SHA256).Hash.ToLower()

          # The release-build compile gate (installer.rs env!) applies to the
          # aokie-dongle LIB, which the helper bin itself links. The pin is
          # meaningless inside the helper (it never dispatches elevation), so
          # the helper build uses a placeholder; the REAL signed hash is
          # exported before the plugin build below and cargo's env! tracking
          # recompiles the lib with it.
          $env:AOKIE_EXPECTED_HELPER_SHA256 = 'helper-build-placeholder'
          cargo build -p aokie-dongle --bin aokie-driver-helper --release
          if ($LASTEXITCODE -ne 0) { throw "helper build failed" }

          # Signing is gated on an EXPLICIT state — the certificate material
          # was provided and decoded — never on the driver-verification tool.
          # The temporary PFX is removed in `finally` even when a later build
          # or signature check throws (audit AK-01).
          $signingEnabled = [bool]$env:CERT_B64
          $pfx = $null
          $signedExecutables = @()
          try {
            if ($signingEnabled) {
              if (-not $env:CERT_PASS) { throw "TRUST-001: WINDOWS_CERT_PASSWORD is required alongside WINDOWS_CERT_PFX_B64" }
              $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
              & $signtool sign /f $pfx /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/aokie-driver-helper.exe
              if ($LASTEXITCODE -ne 0) { throw "helper signing failed" }
              & $signtool verify /pa target/release/aokie-driver-helper.exe
              if ($LASTEXITCODE -ne 0) { throw "helper signature verification failed" }
              $signedExecutables += 'target/release/aokie-driver-helper.exe'
            } else {
              Write-Warning "no signing certificate configured — UNSIGNED smoke build (never a tag release)"
            }

            # Hash the FINAL helper bytes (post-sign when a cert exists) and
            # only now build the plugin, so the embedded pin always matches
            # what actually ships.
            $sha = (Get-FileHash target/release/aokie-driver-helper.exe -Algorithm SHA256).Hash.ToLower()
            "final helper sha256 = $sha"
            $env:AOKIE_EXPECTED_HELPER_SHA256 = $sha
            # Aokie has no speech of its own (OAIY Voice hears and speaks): no
            # voice server, speech libraries or model list ship beside it.
            cargo build -p aokie-plugin --features voice --release
            if ($LASTEXITCODE -ne 0) { throw "plugin build failed" }

            if ($signingEnabled) {
              foreach ($exe in @('target/release/aokie-plugin.exe')) {
                & $signtool sign /f $pfx /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
                if ($LASTEXITCODE -ne 0) { throw "signing failed: $exe" }
                $signedExecutables += $exe
              }
              # Verify EVERY intended final executable before any release
              # metadata is written; the helper's post-sign pin above is
              # unchanged because signing the plugin never touches the helper.
              foreach ($exe in @('target/release/aokie-driver-helper.exe', 'target/release/aokie-plugin.exe')) {
                & $signtool verify /pa $exe
                if ($LASTEXITCODE -ne 0) { throw "signature verification failed: $exe" }
              }
              if ($signedExecutables.Count -ne 2) { throw "expected 2 signed executables, signed $($signedExecutables.Count)" }
              $packagedHelper = (Get-FileHash target/release/aokie-driver-helper.exe -Algorithm SHA256).Hash.ToLower()
              if ($packagedHelper -ne $sha) { throw "helper bytes changed after its hash was pinned ($sha -> $packagedHelper)" }
            }
          } finally {
            if ($pfx -and (Test-Path -LiteralPath $pfx)) { Remove-Item -LiteralPath $pfx -Force }
          }

          # Record the pinned hash and the signing state for the packaging
          # step's cross-check and the release manifest.
          Set-Content -Encoding ascii pinned-helper-sha.txt $sha
          Set-Content -Encoding ascii signing-state.txt $(if ($signingEnabled) { 'signed' } else { 'unsigned' })

      # Audit AOK-REL-002: missing assets FAIL the release, and the
      # pin/signature invariants are re-checked on the exact bytes packaged.
      - name: Assemble + verify bundle (fail closed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item target/release/aokie-plugin.exe bundle/
          Copy-Item target/release/aokie-driver-helper.exe bundle/
          Copy-Item crates/aokie-plugin/manifest.json bundle/
          # Resolve every declared definition and UI file before inventory/signing.
          Copy-Item crates/aokie-plugin/definitions bundle/definitions -Recurse
          Copy-Item crates/aokie-plugin/ui bundle/ui -Recurse
          New-Item -ItemType Directory -Force bundle/driver-package | Out-Null
          Copy-Item drivers/winusb/aokie_winusb_bluetooth.inf bundle/driver-package/
          Copy-Item drivers/winusb/aokie_winusb_bluetooth.cat bundle/driver-package/
          # Realtek's RTL8761B firmware, its config and their licence, pinned: Aokie loads them into such a dongle at each
          # start (realtek.rs), which a phone does not see on its ROM alone
          ./scripts/fetch-realtek-firmware.ps1 -Destination bundle/firmware/rtl_bt
          ./scripts/verify-bundle-assets.ps1 -Bundle bundle

          # Cross-check: the helper bytes being PACKAGED must hash to the pin
          # the plugin was built with — one byte of drift fails the release.
          $pinned = (Get-Content pinned-helper-sha.txt -Raw).Trim()
          $packaged = (Get-FileHash bundle/aokie-driver-helper.exe -Algorithm SHA256).Hash.ToLower()
          if ($pinned -ne $packaged) { throw "helper hash drift: pinned $pinned but packaging $packaged" }

          # Release manifest beside the binaries (AOK-REL-001 acceptance).
          # Signing state as VERIFIED by the build step (every final
          # executable's signature checked), not merely "a secret existed".
          $signingState = (Get-Content signing-state.txt -Raw).Trim()
          if ($signingState -eq 'signed') {
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
            foreach ($exe in @('bundle/aokie-plugin.exe', 'bundle/aokie-driver-helper.exe')) {
              & $signtool verify /pa $exe
              if ($LASTEXITCODE -ne 0) { throw "packaged executable is not signed although the build reported signed: $exe" }
            }
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            throw "TRUST-001: a tag release cannot package an unsigned build"
          }
          $manifest = [ordered]@{
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            ref = $env:GITHUB_SHA
            # The tested compatibility tuple (audit CROSS-COMPAT-001).
            contractVersion = (Get-Content docs/contracts/aokie-connector-contract.v1.json -Raw | ConvertFrom-Json).contractVersion
            flavour = 'voice'
            signed = ($signingState -eq 'signed')
            helperSha256 = $packaged
            driverInfSha256 = (Get-FileHash bundle/driver-package/aokie_winusb_bluetooth.inf -Algorithm SHA256).Hash.ToLower()
            driverCatSha256 = (Get-FileHash bundle/driver-package/aokie_winusb_bluetooth.cat -Algorithm SHA256).Hash.ToLower()
            files = @(Get-ChildItem bundle -File -Recurse | ForEach-Object {
              $name = [IO.Path]::GetRelativePath((Resolve-Path bundle).Path, $_.FullName).Replace('\', '/')
              [ordered]@{ name = $name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
            })
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii bundle/release-manifest.json

      # AK-001: EVERY bundle mutation (release-manifest.json above, the
      # SHA256SUMS.txt convenience checksums here) happens BEFORE the package
      # manifest is signed, so the signed inventory covers the final tree.
      # SHA256SUMS.txt excludes itself and package-manifest.json (which does
      # not exist yet — the signed manifest supersedes it as the integrity
      # authority); the strict verifier covers SHA256SUMS.txt as a listed file.
      - name: Checksums
        shell: pwsh
        working-directory: bundle
        run: |
          Get-ChildItem -File -Recurse | Where-Object { $_.Name -ne 'SHA256SUMS.txt' -and $_.Name -ne 'package-manifest.json' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), [IO.Path]::GetRelativePath((Get-Location).Path, $_.Path).Replace('\', '/') } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # TRUST-001: first-party Ed25519 package manifest over every bundle
      # file. FormLogic Desktop pins the public key (fl-aokie-2026a) and
      # refuses to launch a plugin directory whose signature or digests do
      # not verify. A TAG release without the signing key is a hard failure;
      # dispatch smoke builds warn and stay unsigned. This is the LAST bundle
      # mutation (AK-001) — anything written after it would unsign the tree.
      - name: Sign package manifest (package-signer)
        shell: pwsh
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
        run: |
          if (-not $env:AOKIE_PACKAGE_SIGNING_KEY) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              throw "TRUST-001: tag releases require the AOKIE_PACKAGE_SIGNING_KEY secret (package-signer keygen seed) — refusing an unsigned public release"
            }
            Write-Warning "AOKIE_PACKAGE_SIGNING_KEY not set — smoke bundle ships WITHOUT a package manifest (Desktop will show it as unsigned)"
            exit 0
          }
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "dev-$env:GITHUB_SHA" }
          cargo run -p package-signer --release -- sign --dir bundle --name aokie-plugin --version $version --key-id fl-aokie-2026a --key-env AOKIE_PACKAGE_SIGNING_KEY
          if ($LASTEXITCODE -ne 0) { throw "package signing failed" }

      # AK-001: prove the artifact a customer actually receives verifies —
      # zip the final tree, extract it into a FRESH directory, and run the
      # strict verifier over the extraction (catches any post-sign mutation,
      # archive lossiness, or path-normalisation drift).
      - name: Verify the extracted final artifact
        shell: pwsh
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
        run: |
          Compress-Archive -Path bundle/* -DestinationPath verify-roundtrip.zip -Force
          Expand-Archive -Path verify-roundtrip.zip -DestinationPath verify-extracted -Force
          # Unsigned smoke artifacts must pass the same reference-closure check.
          ./scripts/verify-bundle-assets.ps1 -Bundle verify-extracted
          if (-not $env:AOKIE_PACKAGE_SIGNING_KEY) {
            Write-Warning "asset references verified; unsigned smoke bundle skips signature verification"
            exit 0
          }
          $pub = (cargo run -p package-signer --release --quiet -- pubkey --key-env AOKIE_PACKAGE_SIGNING_KEY | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $pub) { throw "could not derive the signing public key" }
          cargo run -p package-signer --release -- verify --dir bundle --pubkey $pub
          if ($LASTEXITCODE -ne 0) { throw "final bundle tree failed verification" }
          cargo run -p package-signer --release -- verify --dir verify-extracted --pubkey $pub
          if ($LASTEXITCODE -ne 0) { throw "EXTRACTED artifact failed verification — the shipped zip does not match the signed tree" }
          Remove-Item verify-roundtrip.zip -Force
          Remove-Item verify-extracted -Recurse -Force

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aokie-plugin-windows
          path: bundle/*
          if-no-files-found: error
          retention-days: 30

      # DIST-001: tag builds publish a DURABLE release asset (the temp Actions
      # artifact above expires in 30 days — that is a smoke-test convenience,
      # not a distribution channel). Zip name carries the tag for stable URLs.
      - name: Publish release assets (tags only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "aokie-plugin-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path bundle/* -DestinationPath $zip
          gh release create '${{ github.ref_name }}' --verify-tag --title 'Aokie ${{ github.ref_name }}' --notes 'Signed Aokie plugin bundle (plugin + driver helper + manifests + checksums). Aokie has no speech of its own: calls go to OAIY, whose OAIY Voice hears and speaks. Verify with SHA256SUMS.txt and the package-manifest.json publisher signature.' $zip bundle/SHA256SUMS.txt bundle/release-manifest.json bundle/package-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "release publish failed" }

  # The managed-beta bundle (README, "Managed-beta driver build"): for administrator-managed pilots while the
  # Microsoft-signed driver catalog and the Authenticode certificate do not exist. The helper and the plugin are the
  # managed-beta-driver flavour: the helper renders the selected dongle's INF and signs a catalog with a certificate it
  # makes on that PC, and only when the operator accepts that for the install on the dongle setup screen, or
  # pre-authorises the machine with AOKIE_ALLOW_SELF_SIGNED_DRIVER=1 (the production flavour cannot be switched into
  # that). So no driver package ships and no catalog is checked, and the executables are not Authenticode-signed. The
  # package manifest IS signed (fl-aokie-2026a), so OAIY verifies the bundle as Aokie's. Tags
  # whose name contains managed-beta publish it as a GitHub PRE-release labelled managed beta; the production job above
  # never runs for them, and this one never runs for a production tag.
  plugin-release-managed-beta:
    name: aokie-plugin managed-beta bundle
    runs-on: windows-latest
    needs: [plugin, plugin-voice, clippy, supply-chain, managed-beta, companion]
    if: contains(github.ref_name, 'managed-beta') || inputs.bundle == 'managed-beta'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      - name: Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # The production job's order, less the signing of executables: the helper first, its hash pinned into the plugin
      # (the release gate of aokie-dongle), then the plugin.
      - name: Build the managed-beta helper, pin its hash, build the plugin
        shell: pwsh
        run: |
          $env:AOKIE_EXPECTED_HELPER_SHA256 = 'helper-build-placeholder'
          cargo build -p aokie-dongle --bin aokie-driver-helper --features managed-beta-driver --release
          if ($LASTEXITCODE -ne 0) { throw "helper build failed" }
          $sha = (Get-FileHash target/release/aokie-driver-helper.exe -Algorithm SHA256).Hash.ToLower()
          "helper sha256 = $sha"
          $env:AOKIE_EXPECTED_HELPER_SHA256 = $sha
          cargo build -p aokie-plugin --features voice,managed-beta-driver --release
          if ($LASTEXITCODE -ne 0) { throw "plugin build failed" }
          Set-Content -Encoding ascii pinned-helper-sha.txt $sha

      - name: Assemble + verify bundle (fail closed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item target/release/aokie-plugin.exe bundle/
          Copy-Item target/release/aokie-driver-helper.exe bundle/
          Copy-Item crates/aokie-plugin/manifest.json bundle/
          Copy-Item crates/aokie-plugin/definitions bundle/definitions -Recurse
          Copy-Item crates/aokie-plugin/ui bundle/ui -Recurse
          # Realtek's RTL8761B firmware, its config and their licence, pinned: Aokie loads them into such a dongle at each
          # start (realtek.rs), which a phone does not see on its ROM alone
          ./scripts/fetch-realtek-firmware.ps1 -Destination bundle/firmware/rtl_bt
          ./scripts/verify-bundle-assets.ps1 -Bundle bundle

          $pinned = (Get-Content pinned-helper-sha.txt -Raw).Trim()
          $packaged = (Get-FileHash bundle/aokie-driver-helper.exe -Algorithm SHA256).Hash.ToLower()
          if ($pinned -ne $packaged) { throw "helper hash drift: pinned $pinned but packaging $packaged" }

          $manifest = [ordered]@{
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            ref = $env:GITHUB_SHA
            contractVersion = (Get-Content docs/contracts/aokie-connector-contract.v1.json -Raw | ConvertFrom-Json).contractVersion
            flavour = 'managed-beta'
            # Authenticode: the managed beta's executables are not signed with a certificate.
            signed = $false
            helperSha256 = $packaged
            files = @(Get-ChildItem bundle -File -Recurse | ForEach-Object {
              $name = [IO.Path]::GetRelativePath((Resolve-Path bundle).Path, $_.FullName).Replace('\', '/')
              [ordered]@{ name = $name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
            })
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding ascii bundle/release-manifest.json

      - name: Checksums
        shell: pwsh
        working-directory: bundle
        run: |
          Get-ChildItem -File -Recurse | Where-Object { $_.Name -ne 'SHA256SUMS.txt' -and $_.Name -ne 'package-manifest.json' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), [IO.Path]::GetRelativePath((Get-Location).Path, $_.Path).Replace('\', '/') } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # The last bundle mutation, as in the production job: OAIY refuses a bundle whose manifest does not verify against
      # the pinned fl-aokie-2026a key. A managed-beta TAG without the key fails; a dispatch smoke build warns.
      - name: Sign package manifest (package-signer)
        shell: pwsh
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
        run: |
          if (-not $env:AOKIE_PACKAGE_SIGNING_KEY) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              throw "TRUST-001: a managed-beta tag requires the AOKIE_PACKAGE_SIGNING_KEY secret — refusing a bundle OAIY could not verify"
            }
            Write-Warning "AOKIE_PACKAGE_SIGNING_KEY not set — smoke bundle ships WITHOUT a package manifest"
            exit 0
          }
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "dev-$env:GITHUB_SHA" }
          cargo run -p package-signer --release -- sign --dir bundle --name aokie-plugin --version $version --key-id fl-aokie-2026a --key-env AOKIE_PACKAGE_SIGNING_KEY
          if ($LASTEXITCODE -ne 0) { throw "package signing failed" }

      - name: Verify the extracted final artifact
        shell: pwsh
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
        run: |
          Compress-Archive -Path bundle/* -DestinationPath verify-roundtrip.zip -Force
          Expand-Archive -Path verify-roundtrip.zip -DestinationPath verify-extracted -Force
          ./scripts/verify-bundle-assets.ps1 -Bundle verify-extracted
          if (-not $env:AOKIE_PACKAGE_SIGNING_KEY) {
            Write-Warning "asset references verified; unsigned smoke bundle skips signature verification"
            exit 0
          }
          $pub = (cargo run -p package-signer --release --quiet -- pubkey --key-env AOKIE_PACKAGE_SIGNING_KEY | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $pub) { throw "could not derive the signing public key" }
          # The key OAIY pins (platform/desktop/src-tauri/resources/trusted-publishers.json in the OAIY repository).
          if ($pub -ne 'n832sELL2yC6UksKhiz4C4UY7P9//mf8JfeFJRcuk5s=') { throw "the signing key is not fl-aokie-2026a, which OAIY pins" }
          cargo run -p package-signer --release -- verify --dir bundle --pubkey $pub
          if ($LASTEXITCODE -ne 0) { throw "final bundle tree failed verification" }
          cargo run -p package-signer --release -- verify --dir verify-extracted --pubkey $pub
          if ($LASTEXITCODE -ne 0) { throw "EXTRACTED artifact failed verification — the shipped zip does not match the signed tree" }
          Remove-Item verify-roundtrip.zip -Force
          Remove-Item verify-extracted -Recurse -Force

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aokie-plugin-windows-managed-beta
          path: bundle/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish the pre-release (managed-beta tags only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "aokie-plugin-windows-$tag.zip"
          Compress-Archive -Path bundle/* -DestinationPath $zip
          $notes = @(
            "**Managed beta, for administrator-managed pilots.** This is not the production package: its executables are not Authenticode-signed (Windows names no publisher, also on the driver helper's elevation prompt), and the Microsoft-signed driver catalog does not exist yet.",
            "",
            "The bundle is signed with Aokie's package key (fl-aokie-2026a): OAIY verifies it as Aokie's and refuses it if any file in it changes.",
            "",
            "**Install:** in OAIY Desktop, Connections, Plugins, Install a plugin, and choose $zip. The setup wizard opens after the install.",
            "",
            "**Call audio** goes through a USB Bluetooth dongle bound to WinUSB. Nothing needs setting first: when Aokie's dongle setup installs the dongle's driver, it explains that this build signs the driver on that PC (the driver helper makes a certificate there, signs the dongle's driver catalog with it, deletes its private key, and Windows trusts the certificate machine-wide, in LocalMachine Root and TrustedPublisher) and asks you to tick that you accept it before Install works; then choose Yes on the Windows prompt. It asks again for every install. Restore driver gives the dongle back to Windows. An administrator can pre-authorise a machine instead with AOKIE_ALLOW_SELF_SIGNED_DRIVER=1 for the account that runs OAIY (OAIY 0.1.2 or later passes it to Aokie); the setup then does not ask.",
            "",
            "Without that driver, texts, contacts and call control work through Windows' own Bluetooth, with no call audio.",
            "",
            "**Verify:** SHA256SUMS.txt, and package-signer verify --dir <extracted bundle> --pubkey n832sELL2yC6UksKhiz4C4UY7P9//mf8JfeFJRcuk5s="
          )
          Set-Content -Encoding utf8 managed-beta-notes.md $notes
          gh release create $tag --verify-tag --prerelease --title "Aokie $tag (managed beta)" --notes-file managed-beta-notes.md $zip bundle/SHA256SUMS.txt bundle/release-manifest.json bundle/package-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "release publish failed" }

  # The Mac's bundle (Apple silicon), beside the Windows one, for both kinds of release: on a Mac there is no driver
  # and no flavour, Aokie opens the dongle itself through libusb. scripts/bundle-unix.sh builds it, with libusb as a
  # library beside the plugin (LGPL-2.1: its licence and source go in third-party/), every program and library is
  # signed ad hoc (what an Apple-silicon Mac runs; no Developer ID, so the login Keychain asks again for each new
  # build), the bundle is started from its folder and asked what OAIY asks a plugin first, and it is signed with
  # Aokie's package key as the Windows bundle is, so OAIY verifies it as Aokie's. The zip is the run's artifact;
  # publish-macos attaches it to the release.
  plugin-release-macos:
    name: aokie-plugin macOS bundle (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 120
    needs: [plugin, plugin-voice, clippy, supply-chain, managed-beta, companion]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      # No build cache, as in unix-bundle.yml: a release is built whole.

      # Aokie has no speech of its own: no ONNX Runtime, speech engine, voice server or model goes in the bundle.
      # (cmake 4 builds older CMake files only with a minimum policy named)
      - name: Build and lay out the plugin
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: sh scripts/bundle-unix.sh "$PWD/bundle"

      # Before anything is checked or signed: what is checked is what ships.
      - name: Sign ad hoc
        run: |
          set -euo pipefail
          find bundle -type f \( -perm +111 -o -name '*.dylib' \) -print0 | xargs -0 -n1 codesign --force --sign -
          find bundle -type f \( -perm +111 -o -name '*.dylib' \) -print0 | xargs -0 -n1 codesign --verify --strict
          otool -L bundle/aokie-plugin | grep -E 'libusb|@rpath'

      - name: The bundled plugin starts from its folder and answers
        run: python3 scripts/virtual-dongle/plugin_check.py --no-dongle "$PWD/bundle/aokie-plugin"

      - name: Release manifest and checksums
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path("bundle")
          contract = json.loads(pathlib.Path("docs/contracts/aokie-connector-contract.v1.json").read_text())["contractVersion"]
          manifest = {
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "ref": os.environ["GITHUB_SHA"],
              "contractVersion": contract,
              "flavour": "macos-arm64",
              # (no Developer ID: the programs are signed ad hoc)
              "signed": False,
              "files": [{"name": p.relative_to(root).as_posix(), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                        for p in sorted(root.rglob("*")) if p.is_file()],
          }
          (root / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          EOF
          cd bundle
          find . -type f ! -name SHA256SUMS.txt ! -name package-manifest.json | sed 's|^\./||' | LC_ALL=C sort |
            while IFS= read -r f; do shasum -a 256 "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The last change to the bundle. A tag, or a run that attaches to a release, refuses to go on without the key.
      - name: Sign package manifest (package-signer)
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
          ATTACH_TO: ${{ inputs.attach_macos_to }}
        run: |
          set -euo pipefail
          if [ -z "${AOKIE_PACKAGE_SIGNING_KEY:-}" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "${ATTACH_TO:-}" ]; then
              echo "::error::TRUST-001: a Mac bundle for a release requires the AOKIE_PACKAGE_SIGNING_KEY secret"; exit 1
            fi
            echo "::warning::AOKIE_PACKAGE_SIGNING_KEY not set: the smoke bundle ships WITHOUT a package manifest"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; elif [ -n "${ATTACH_TO:-}" ]; then version=$ATTACH_TO; else version="dev-$GITHUB_SHA"; fi
          cargo run -p package-signer --release -- sign --dir bundle --name aokie-plugin --version "$version" --key-id fl-aokie-2026a --key-env AOKIE_PACKAGE_SIGNING_KEY

      # The zip keeps each program's executable bit (OAIY's install takes it from there). It is unpacked again and
      # checked as OAIY will have it: signed as built, and starting from that folder.
      - name: Zip, and verify the unpacked zip
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
          ATTACH_TO: ${{ inputs.attach_macos_to }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=$GITHUB_REF_NAME; elif [ -n "${ATTACH_TO:-}" ]; then label=$ATTACH_TO; else label=dev; fi
          zip="aokie-plugin-macos-arm64-$label.zip"
          (cd bundle && zip -q -r -X "../$zip" .)
          shasum -a 256 "$zip" | tee "$zip.sha256"
          mkdir verify-extracted
          (cd verify-extracted && unzip -q "../$zip")
          [ -x verify-extracted/aokie-plugin ] || { echo "::error::the unpacked aokie-plugin is not executable"; exit 1; }
          diff -r bundle verify-extracted
          if [ -n "${AOKIE_PACKAGE_SIGNING_KEY:-}" ]; then
            pub=$(cargo run -p package-signer --release --quiet -- pubkey --key-env AOKIE_PACKAGE_SIGNING_KEY | tail -n 1 | tr -d '[:space:]')
            # The key OAIY pins (platform/desktop/src-tauri/resources/trusted-publishers.json in the OAIY repository).
            [ "$pub" = 'n832sELL2yC6UksKhiz4C4UY7P9//mf8JfeFJRcuk5s=' ] || { echo "::error::the signing key is not fl-aokie-2026a, which OAIY pins"; exit 1; }
            cargo run -p package-signer --release -- verify --dir bundle --pubkey "$pub"
            cargo run -p package-signer --release -- verify --dir verify-extracted --pubkey "$pub"
          fi
          python3 scripts/virtual-dongle/plugin_check.py --no-dongle "$PWD/verify-extracted/aokie-plugin"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aokie-plugin-macos-arm64
          path: |
            aokie-plugin-macos-arm64-*.zip
            aokie-plugin-macos-arm64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # The Mac bundle onto the release: a tag's, once its Windows job has made it, or the one a dispatch names in
  # attach_macos_to (that release's Windows job ran long before). Its notes get a paragraph for the Mac. Nothing that
  # is already there is replaced.
  publish-macos:
    name: attach the macOS bundle to the release
    runs-on: ubuntu-latest
    needs: [plugin-release-macos, plugin-release, plugin-release-managed-beta]
    if: >-
      always() && needs.plugin-release-macos.result == 'success' && (
        (github.ref_type == 'tag' && (needs.plugin-release.result == 'success' || needs.plugin-release-managed-beta.result == 'success'))
        || (github.event_name == 'workflow_dispatch' && inputs.attach_macos_to != ''))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aokie-plugin-macos-arm64

      - name: Attach to the release, and say so in its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.attach_macos_to }}
        run: |
          set -euo pipefail
          zip="aokie-plugin-macos-arm64-$TAG.zip"
          [ -f "$zip" ] && [ -f "$zip.sha256" ] || { echo "::error::$zip is not in the artifact"; ls -la; exit 1; }
          gh release upload "$TAG" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if ! grep -q 'aokie-plugin-macos-arm64' notes.md; then
            cat >> notes.md <<EOF

          **On a Mac (Apple silicon, macOS 11 or later):** $zip is the plugin for macOS, signed with the same package key (fl-aokie-2026a), so OAIY verifies it as Aokie's; $zip.sha256 is its checksum. Install it the same way: in OAIY Desktop, Connections, Plugins, Install a plugin. On a Mac, Aokie opens the USB Bluetooth dongle itself through libusb: no driver is installed, and there is no fallback to the computer's own Bluetooth (docs/HARDWARE.md, macOS). Its programs are signed ad hoc, not with an Apple Developer ID, so the login Keychain asks before Aokie uses its key after each new version. libusb is LGPL-2.1 and comes as a library beside the plugin, with its licence and source in third-party/. Aokie has no speech of its own: calls go to OAIY, whose OAIY Voice hears and speaks, and nothing is downloaded. Built from $GITHUB_SHA.
          EOF
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi

  # The Linux bundle (x86_64), beside the Windows and Mac ones: as on a Mac there is no driver and no flavour, Aokie
  # opens the dongle itself through libusb (the system's libusb-1.0, which a desktop has), once the udev rule its
  # dongle setup step puts in place gives the dongle to the user at the console. Built on Ubuntu 22.04 so that it runs
  # on 22.04 and every later release: what it links is the oldest a supported desktop has. The bundle is started from
  # its folder and asked what OAIY asks a plugin first, and signed with Aokie's package key as the others are, so OAIY
  # verifies it as Aokie's. The zip is the run's artifact; publish-linux attaches it to the release.
  plugin-release-linux:
    name: aokie-plugin Linux bundle (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: [plugin, plugin-voice, clippy, supply-chain, managed-beta, companion]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      # As unix-bundle.yml: libusb and udev for the USB transport, libdbus for the Secret Service the sealing key is
      # kept in, ALSA and the X libraries for libwebrtc, and clang 21 (libwebrtc's libc++ asks for it; 22.04 has 14).
      # No build cache, as for the Mac's.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libusb-1.0-0-dev libudev-dev libdbus-1-dev pkg-config cmake zip unzip \
            libasound2-dev libssl-dev libglib2.0-dev libx11-dev libxext-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 libclang-21-dev
          {
            echo "CC=clang-21"
            echo "CXX=clang++-21"
            echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib"
          } >> "$GITHUB_ENV"

      - name: Build and lay out the plugin
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: sh scripts/bundle-unix.sh "$PWD/bundle"

      # The system's libusb, a library of its own (LGPL-2.1: loaded, not built in), and nothing else unresolved.
      - name: What the plugin links
        run: |
          set -euo pipefail
          ldd bundle/aokie-plugin | tee ldd.txt
          grep -q 'libusb-1.0.so.0 => /' ldd.txt || { echo "::error::the plugin does not load the system's libusb"; exit 1; }
          ! grep -q 'not found' ldd.txt || { echo "::error::the plugin needs a library that is not there"; exit 1; }

      - name: The bundled plugin starts from its folder and answers
        run: python3 scripts/virtual-dongle/plugin_check.py --no-dongle "$PWD/bundle/aokie-plugin"

      - name: Release manifest and checksums
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path("bundle")
          contract = json.loads(pathlib.Path("docs/contracts/aokie-connector-contract.v1.json").read_text())["contractVersion"]
          manifest = {
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "ref": os.environ["GITHUB_SHA"],
              "contractVersion": contract,
              "flavour": "linux-x86_64",
              # (Linux has no code signing of its own: the package manifest's signature is the bundle's)
              "signed": False,
              "files": [{"name": p.relative_to(root).as_posix(), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
                        for p in sorted(root.rglob("*")) if p.is_file()],
          }
          (root / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          EOF
          cd bundle
          find . -type f ! -name SHA256SUMS.txt ! -name package-manifest.json | sed 's|^\./||' | LC_ALL=C sort |
            while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The last change to the bundle. A tag, or a run that attaches to a release, refuses to go on without the key.
      - name: Sign package manifest (package-signer)
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
          ATTACH_TO: ${{ inputs.attach_linux_to }}
        run: |
          set -euo pipefail
          if [ -z "${AOKIE_PACKAGE_SIGNING_KEY:-}" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "${ATTACH_TO:-}" ]; then
              echo "::error::TRUST-001: a Linux bundle for a release requires the AOKIE_PACKAGE_SIGNING_KEY secret"; exit 1
            fi
            echo "::warning::AOKIE_PACKAGE_SIGNING_KEY not set: the smoke bundle ships WITHOUT a package manifest"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; elif [ -n "${ATTACH_TO:-}" ]; then version=$ATTACH_TO; else version="dev-$GITHUB_SHA"; fi
          cargo run -p package-signer --release -- sign --dir bundle --name aokie-plugin --version "$version" --key-id fl-aokie-2026a --key-env AOKIE_PACKAGE_SIGNING_KEY

      # The zip keeps each program's executable bit (OAIY's install takes it from there). It is unpacked again and
      # checked as OAIY will have it: signed as built, and starting from that folder.
      - name: Zip, and verify the unpacked zip
        env:
          AOKIE_PACKAGE_SIGNING_KEY: ${{ secrets.AOKIE_PACKAGE_SIGNING_KEY }}
          ATTACH_TO: ${{ inputs.attach_linux_to }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then label=$GITHUB_REF_NAME; elif [ -n "${ATTACH_TO:-}" ]; then label=$ATTACH_TO; else label=dev; fi
          zip="aokie-plugin-linux-x86_64-$label.zip"
          (cd bundle && zip -q -r -X "../$zip" .)
          sha256sum "$zip" | tee "$zip.sha256"
          mkdir verify-extracted
          (cd verify-extracted && unzip -q "../$zip")
          [ -x verify-extracted/aokie-plugin ] || { echo "::error::the unpacked aokie-plugin is not executable"; exit 1; }
          diff -r bundle verify-extracted
          if [ -n "${AOKIE_PACKAGE_SIGNING_KEY:-}" ]; then
            pub=$(cargo run -p package-signer --release --quiet -- pubkey --key-env AOKIE_PACKAGE_SIGNING_KEY | tail -n 1 | tr -d '[:space:]')
            # The key OAIY pins (platform/desktop/src-tauri/resources/trusted-publishers.json in the OAIY repository).
            [ "$pub" = 'n832sELL2yC6UksKhiz4C4UY7P9//mf8JfeFJRcuk5s=' ] || { echo "::error::the signing key is not fl-aokie-2026a, which OAIY pins"; exit 1; }
            cargo run -p package-signer --release -- verify --dir bundle --pubkey "$pub"
            cargo run -p package-signer --release -- verify --dir verify-extracted --pubkey "$pub"
          fi
          python3 scripts/virtual-dongle/plugin_check.py --no-dongle "$PWD/verify-extracted/aokie-plugin"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aokie-plugin-linux-x86_64
          path: |
            aokie-plugin-linux-x86_64-*.zip
            aokie-plugin-linux-x86_64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # The Linux bundle onto the release, as publish-macos does the Mac's: a tag's, once its Windows job has made it, or
  # the one a dispatch names in attach_linux_to. Its notes get a paragraph for Linux. Nothing already there is replaced.
  publish-linux:
    name: attach the Linux bundle to the release
    runs-on: ubuntu-latest
    needs: [plugin-release-linux, plugin-release, plugin-release-managed-beta]
    if: >-
      always() && needs.plugin-release-linux.result == 'success' && (
        (github.ref_type == 'tag' && (needs.plugin-release.result == 'success' || needs.plugin-release-managed-beta.result == 'success'))
        || (github.event_name == 'workflow_dispatch' && inputs.attach_linux_to != ''))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aokie-plugin-linux-x86_64

      - name: Attach to the release, and say so in its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.attach_linux_to }}
        run: |
          set -euo pipefail
          zip="aokie-plugin-linux-x86_64-$TAG.zip"
          [ -f "$zip" ] && [ -f "$zip.sha256" ] || { echo "::error::$zip is not in the artifact"; ls -la; exit 1; }
          gh release upload "$TAG" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if ! grep -q 'aokie-plugin-linux-x86_64' notes.md; then
            cat >> notes.md <<EOF

          **On Linux (x86_64; Ubuntu 22.04 or later, or a distribution as recent):** $zip is the plugin for Linux, signed with the same package key (fl-aokie-2026a), so OAIY verifies it as Aokie's; $zip.sha256 is its checksum. Install it the same way: in OAIY Desktop, Connections, Plugins, Install a plugin. On Linux, Aokie opens the USB Bluetooth dongle itself through the system's libusb: its dongle setup step puts a udev rule in place (the desktop asks for your password) that gives the dongle to you, and Aokie takes it from the system's Bluetooth only while it runs. Only a dongle in Aokie's catalog is used: the computer's own Bluetooth is left to the system. What Aokie keeps (the phone's pairing keys, texts and transcripts) is sealed under a key in the desktop's keyring (the Secret Service: GNOME Keyring, KWallet). Aokie has no speech of its own: calls go to OAIY, whose OAIY Voice hears and speaks, and nothing is downloaded. Built from $GITHUB_SHA.
          EOF
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
